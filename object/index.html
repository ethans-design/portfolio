<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>object — Ethan Saunders</title>
  <meta name="description" content="Course documentation for Object — process and final documentation of each project, by Ethan Saunders." />
  <link rel="icon" type="image/png" href="../assets/EthanFace.png" />
  <link rel="stylesheet" href="object.css" />
  <link rel="stylesheet" href="https://use.typekit.net/kjc2rnh.css" />
</head>
<body>
  <a href="#main" class="skip-link">skip to content</a>

  <!--
    OBJECT — documentation page. Add a new <section class="assignment"> per project
    (and a matching nav link) as the semester goes. Keep every image/video paired
    with a written what / how / why.
  -->

  <div class="wrap">
    <!-- SIDEBAR NAV -->
    <aside class="sidebar" aria-label="Assignments">
      <div class="brand">
        <div class="kicker">documentation</div>
        <h1>object</h1>
        <div class="sub">Ethan Saunders · Creative Technology &amp; Design · Fall 2026</div>
      </div>

      <nav class="nav" aria-label="Projects">
        <a href="#technology-tinder" class="nav-link">Technology Tinder</a>
      </nav>

      <div class="side-foot">
        <a href="../index.html">← ethanlabs.co</a>
      </div>
    </aside>

    <!-- MAIN -->
    <main id="main">
      <!-- TECHNOLOGY TINDER -->
      <section id="technology-tinder" class="assignment" style="border-top:none; padding-top:14px;">
        <div class="sec-head">
          <span class="tag">warm-up</span>
          <h2>Technology Tinder</h2>
        </div>

        <div class="compare">
          <figure class="car-card">
            <div class="car-media">
              <img src="assets/prelude-2026.jpg" alt="White 2026 Honda Prelude, front three-quarter view" />
            </div>
            <figcaption class="car-label">2026 Honda Prelude</figcaption>
          </figure>

          <figure class="car-card">
            <div class="car-media">
              <img src="assets/prelude-1998.jpg" alt="Red 1998 Honda Prelude, front three-quarter view" />
            </div>
            <figcaption class="car-label">1998 Honda Prelude</figcaption>
          </figure>
        </div>
      </section>

      <footer class="page-foot">
        <p>Object · Fall 2026 · documentation by Ethan Saunders · <a href="../index.html">ethanlabs.co</a></p>
      </footer>
    </main>
  </div>

  <script>
    // active-section highlight (scales as more projects are added)
    const links = [...document.querySelectorAll(".nav-link")];
    const sections = links.map((l) => document.querySelector(l.getAttribute("href"))).filter(Boolean);
    const byId = (id) => links.find((l) => l.getAttribute("href") === "#" + id);
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        links.forEach((l) => l.classList.remove("active"));
        const a = byId(e.target.id); if (a) a.classList.add("active");
      });
    }, { rootMargin: "-30% 0px -60% 0px" });
    sections.forEach((s) => obs.observe(s));
  </script>
</body>
</html>
